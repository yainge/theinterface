<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LED Pattern Simulator — The Interface</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #ccc; font-family: monospace; padding: 24px; }
  h1 { font-size: 14px; color: #888; margin-bottom: 20px; letter-spacing: 2px; text-transform: uppercase; }

  #strip-wrap { background: #111; border: 1px solid #222; border-radius: 8px; padding: 24px 16px; margin-bottom: 20px; }
  #strip { display: flex; gap: 2px; }
  .led { flex: 1; height: 48px; border-radius: 3px; background: #0d0d0d; transition: none; }

  .panel { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .card { background: #161616; border: 1px solid #222; border-radius: 6px; padding: 16px; min-width: 200px; }
  .card h2 { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .row label { font-size: 12px; color: #999; white-space: nowrap; }
  .row input[type=range] { flex: 1; accent-color: #e63c00; }
  .row span { font-size: 12px; color: #e63c00; width: 36px; text-align: right; }
  .row input[type=color] { width: 40px; height: 26px; border: none; background: none; cursor: pointer; }

  .btn { padding: 10px 20px; border: none; border-radius: 4px; font-family: monospace; font-size: 13px; cursor: pointer; }
  .btn-beat { background: #e63c00; color: #fff; }
  .btn-beat:hover { background: #ff5500; }
  .btn-pat { background: #222; color: #ccc; border: 1px solid #333; }
  .btn-pat.active { background: #333; color: #fff; border-color: #555; }

  .bpm-wrap { display: flex; align-items: center; gap: 10px; }
  .bpm-on { background: #1a3a1a; color: #4caf50; border: 1px solid #2d5a2d; }
  .bpm-on.active { background: #2d5a2d; color: #8bc34a; }

  #status { font-size: 11px; color: #555; margin-top: 8px; }

  .patterns { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>

<h1>The Interface — LED Pattern Simulator (44 LEDs)</h1>

<div id="strip-wrap">
  <div id="strip"></div>
  <div id="status">Pattern: <span id="pat-name">Sparkle Twinkle</span> &nbsp;|&nbsp; Beat pulse: <span id="pulse-val">0</span></div>
</div>

<div class="panel">

  <div class="card">
    <h2>Patterns</h2>
    <div class="patterns">
      <button class="btn btn-pat active" onclick="setPattern(0)">Sparkle</button>
      <button class="btn btn-pat" onclick="setPattern(1)">Solid Pulse</button>
      <button class="btn btn-pat" onclick="setPattern(2)">Wave</button>
      <button class="btn btn-pat" onclick="setPattern(3)">Chase</button>
    </div>
  </div>

  <div class="card">
    <h2>Trigger</h2>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
      <button class="btn btn-beat" onclick="triggerBeat()">&#9829; Beat</button>
      <button class="btn btn-pat bpm-on" id="bpm-toggle" onclick="toggleAutoBPM()">Auto BPM</button>
    </div>
    <div class="row">
      <label>BPM</label>
      <input type="range" min="40" max="120" value="70" id="bpm-slider" oninput="updateBPM(this.value)">
      <span id="bpm-val">70</span>
    </div>
  </div>

  <div class="card">
    <h2>Color</h2>
    <div class="row">
      <label>Beat color</label>
      <input type="color" id="beat-color" value="#dc3c00" oninput="updateColor()">
    </div>
    <div class="row">
      <label>Ambient color</label>
      <input type="color" id="ambient-color" value="#dc3c00" oninput="updateColor()">
    </div>
  </div>

  <div class="card">
    <h2>Tuning</h2>
    <div class="row">
      <label>Beat decay</label>
      <input type="range" min="1" max="30" value="8" id="decay-slider" oninput="LED_BEAT_DECAY=+this.value; document.getElementById('decay-val').textContent=this.value">
      <span id="decay-val">8</span>
    </div>
    <div class="row">
      <label>Ambient floor</label>
      <input type="range" min="0" max="40" value="3" id="floor-slider" oninput="LED_AMBIENT_FLOOR=+this.value; document.getElementById('floor-val').textContent=this.value">
      <span id="floor-val">3</span>
    </div>
    <div class="row">
      <label>Sparkle peak</label>
      <input type="range" min="10" max="200" value="60" id="sparkle-slider" oninput="LED_SPARKLE_PEAK=+this.value; document.getElementById('sparkle-val').textContent=this.value">
      <span id="sparkle-val">60</span>
    </div>
  </div>

</div>

<script>
// ── Mirror of Arduino constants (edit here, copy back to theinterface.ino) ──
const LED_COUNT = 44;
const NUM_SPARKLES = 6;
let LED_BEAT_DECAY    = 8;
let LED_PIXEL_DECAY   = 4;
let LED_AMBIENT_FLOOR = 3;
let LED_SPARKLE_PEAK  = 60;
const LED_UPDATE_MS   = 20;

// ── Color ────────────────────────────────────────────────────────────────────
let beatRGB    = { r: 220, g: 60, b: 0 };
let ambientRGB = { r: 220, g: 60, b: 0 };

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return { r, g, b };
}
function updateColor() {
  beatRGB    = hexToRgb(document.getElementById('beat-color').value);
  ambientRGB = hexToRgb(document.getElementById('ambient-color').value);
}

// ── State ────────────────────────────────────────────────────────────────────
let pxBright      = new Uint8Array(LED_COUNT).fill(LED_AMBIENT_FLOOR);
let beatPulse     = 0;
let sparklePos    = Array.from({length: NUM_SPARKLES}, () => Math.floor(Math.random()*LED_COUNT));
let sparkleTimer  = Array.from({length: NUM_SPARKLES}, () => Math.floor(Math.random()*40)+10);

let currentPattern = 0;
let chaseHead = 0;
let wavePhase = 0;

// ── Beat trigger ─────────────────────────────────────────────────────────────
function triggerBeat() {
  beatPulse = 255;
  for (let i = 0; i < LED_COUNT; i++) pxBright[i] = 255;

  // Pattern-specific beat actions
  if (currentPattern === 3) chaseHead = 0; // reset chase on beat
}

// ── Auto BPM ─────────────────────────────────────────────────────────────────
let autoBPM = true;
let bpm = 70;
let nextBeatTime = 0;

function toggleAutoBPM() {
  autoBPM = !autoBPM;
  document.getElementById('bpm-toggle').classList.toggle('active', autoBPM);
}
function updateBPM(v) {
  bpm = +v;
  document.getElementById('bpm-val').textContent = v;
}

// ── Pattern setters ───────────────────────────────────────────────────────────
const patNames = ['Sparkle Twinkle', 'Solid Pulse', 'Wave', 'Chase'];
function setPattern(n) {
  currentPattern = n;
  document.getElementById('pat-name').textContent = patNames[n];
  document.querySelectorAll('.btn-pat').forEach((b,i) => b.classList.toggle('active', i===n));
  pxBright.fill(LED_AMBIENT_FLOOR);
  beatPulse = 0;
  chaseHead = 0;
  wavePhase = 0;
}

// ── LED DOM ───────────────────────────────────────────────────────────────────
const stripEl = document.getElementById('strip');
for (let i = 0; i < LED_COUNT; i++) {
  const d = document.createElement('div');
  d.className = 'led';
  d.id = 'led'+i;
  stripEl.appendChild(d);
}

function setLED(i, r, g, b) {
  document.getElementById('led'+i).style.background =
    `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
}

function lerp(a, b, t) { return a + (b-a)*t; }

// ── Main update loop ──────────────────────────────────────────────────────────
function update() {
  const now = performance.now();

  // Auto-trigger beats
  if (autoBPM && now >= nextBeatTime) {
    triggerBeat();
    nextBeatTime = now + 60000 / bpm;
  }

  // Decay beat pulse
  if (beatPulse > LED_BEAT_DECAY) beatPulse -= LED_BEAT_DECAY;
  else beatPulse = 0;

  document.getElementById('pulse-val').textContent = beatPulse;

  // Pattern-specific update
  if (currentPattern === 0) updateSparkle();
  else if (currentPattern === 1) updateSolid();
  else if (currentPattern === 2) updateWave();
  else if (currentPattern === 3) updateChase();
}

// Pattern 0: Sparkle Twinkle (mirrors Arduino code exactly)
function updateSparkle() {
  // Decay pixels
  for (let i = 0; i < LED_COUNT; i++) {
    if (pxBright[i] > LED_AMBIENT_FLOOR + LED_PIXEL_DECAY)
      pxBright[i] -= LED_PIXEL_DECAY;
    else
      pxBright[i] = LED_AMBIENT_FLOOR;
  }

  // Advance sparkles only when beat has faded
  if (beatPulse === 0) {
    for (let i = 0; i < NUM_SPARKLES; i++) {
      if (sparkleTimer[i] === 0) {
        sparklePos[i] = Math.floor(Math.random() * LED_COUNT);
        pxBright[sparklePos[i]] = Math.floor(Math.random() * (LED_SPARKLE_PEAK - LED_SPARKLE_PEAK/2) + LED_SPARKLE_PEAK/2);
        sparkleTimer[i] = Math.floor(Math.random() * 35) + 15;
      } else {
        sparkleTimer[i]--;
      }
    }
  }

  // Render
  for (let i = 0; i < LED_COUNT; i++) {
    let b = Math.min(255, pxBright[i] + beatPulse);
    let t = b / 255;
    let r = lerp(ambientRGB.r * LED_AMBIENT_FLOOR/255, beatRGB.r, t);
    let g = lerp(ambientRGB.g * LED_AMBIENT_FLOOR/255, beatRGB.g, t);
    let bv = lerp(ambientRGB.b * LED_AMBIENT_FLOOR/255, beatRGB.b, t);
    setLED(i, beatRGB.r*b/255, beatRGB.g*b/255, beatRGB.b*b/255);
  }
}

// Pattern 1: Solid dim baseline, bright full-strip pulse on beat
function updateSolid() {
  for (let i = 0; i < LED_COUNT; i++) {
    let b = Math.min(255, LED_AMBIENT_FLOOR + beatPulse);
    setLED(i, beatRGB.r*b/255, beatRGB.g*b/255, beatRGB.b*b/255);
  }
}

// Pattern 2: Brightness sine wave that shifts on each beat
function updateWave() {
  wavePhase += 0.08;
  for (let i = 0; i < LED_COUNT; i++) {
    let wave = (Math.sin(i * 0.4 + wavePhase) + 1) / 2; // 0..1
    let ambient = Math.floor(wave * 40 + LED_AMBIENT_FLOOR);
    let b = Math.min(255, ambient + beatPulse);
    setLED(i, beatRGB.r*b/255, beatRGB.g*b/255, beatRGB.b*b/255);
  }
}

// Pattern 3: A bright point that chases down the strip on each beat
function updateChase() {
  for (let i = 0; i < LED_COUNT; i++) {
    let dist = Math.abs(i - chaseHead);
    let glow = Math.max(0, 80 - dist * 12);
    let b = Math.min(255, glow + LED_AMBIENT_FLOOR);
    setLED(i, beatRGB.r*b/255, beatRGB.g*b/255, beatRGB.b*b/255);
  }
  if (chaseHead < LED_COUNT) chaseHead += 1.2;
}

setInterval(update, LED_UPDATE_MS);
</script>
</body>
</html>
